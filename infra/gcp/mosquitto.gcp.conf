# Broker on the GCP VM.
#   1883: plain MQTT for the backend inside the Docker network (the GCP firewall blocks it from outside).
#   8883: MQTT over TLS with user and password, for the ESP32 node over the internet.
per_listener_settings true

listener 1883
protocol mqtt
allow_anonymous true

listener 8883
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwd
certfile /mosquitto/certs/fullchain.pem
keyfile /mosquitto/certs/privkey.pem

persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
