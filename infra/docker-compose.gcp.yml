# GCP VM overlay, on top of docker-compose.yml and infra/docker-compose.prod.yml.
# Swaps the domain-specific nginx config and gives Mosquitto a TLS listener with a password.
services:
  frontend:
    volumes:
      - ./infra/gcp/nginx.gcp.conf:/etc/nginx/conf.d/default.conf:ro
  mosquitto:
    ports: !override
      - "127.0.0.1:1883:1883"
      - "8883:8883"
    volumes:
      - ./infra/gcp/mosquitto.gcp.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infra/gcp/passwd:/mosquitto/config/passwd:ro
      - /opt/ccs-mqtt-certs:/mosquitto/certs:ro
