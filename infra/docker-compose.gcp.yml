# GCP VM overlay, on top of docker-compose.yml and infra/docker-compose.prod.yml.
# Swaps the domain-specific nginx config, gives Mosquitto a TLS listener with a password and
# tells the backend how nodes reach the broker. Public settings only: secrets stay in .env.
services:
  backend:
    environment:
      # Shown in Aulas → "Conectar nodo". The broker password is never here.
      NODE_MQTT_HOST: 136.115.102.131.sslip.io
      NODE_MQTT_PORT: "8883"
      NODE_MQTT_USER: nodo
  frontend:
    volumes:
      - ./infra/gcp/nginx.gcp.conf:/etc/nginx/conf.d/default.conf:ro
  mosquitto:
    ports: !override
      - "127.0.0.1:1883:1883"
      - "8883:8883"
    volumes:
      - ./infra/gcp/mosquitto.gcp.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infra/gcp/passwd:/mosquitto/config/passwd:ro
      - /opt/ccs-mqtt-certs:/mosquitto/certs:ro
